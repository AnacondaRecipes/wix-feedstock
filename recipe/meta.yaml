{% set name = "wix" %}
{% set version = "5.0.2" %}

# nuget.exe is downloaded as a build-time helper only (consumed by upstream
# devbuild.cmd's `nuget restore` calls in src/internal and src/burn) and is
# never staged into %PREFIX%. AR does not ship a standalone `nuget` package
# (binary-repack policy, per Charles 2026-05).
{% set nuget_version = "6.14.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/wixtoolset/wix/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 78c08fea127a2219c916023da90cc00780553088353702482d2942eae57ca586
  - url: https://dist.nuget.org/win-x86-commandline/v{{ nuget_version }}/nuget.exe
    fn: nuget.exe
    folder: build_helpers
    sha256: 8103c5666f63528d9fec59b53c5ae4b6feed7c8aec2930e344e870375f408a90

build:
  number: 0
  skip: True  # [not win]
  binary_relocation: False
  ignore_run_exports:
    - '*'
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    # .NET 8 SDK — compiles both net6.0 (with RollForward) and net472 targets.
    # The net472 leg additionally requires the .NET Framework 4.7.2 SDK and
    # targeting packs to be installed on the build worker (PBP win-64 AMI;
    # not conda-packageable). MSVC v143 is also required by upstream's
    # devbuild.cmd (vswhere → vsdevcmd) and must be present on the AMI.
    - dotnet >=8.0,<9
  run:
    # wix.exe is published framework-dependent net6.0 with RollForward=Major
    # (set in src/wix/wix/wix.csproj), so a .NET 6+ runtime is sufficient.
    - dotnet-runtime >=8.0,<9

test:
  commands:
    # File-presence checks (cheap + reliable)
    - if not exist "%PREFIX%\Library\bin\wix.bat" exit 1
    - if not exist "%PREFIX%\Library\wix\sdk\wix\wix.exe" exit 1
    - if not exist "%PREFIX%\Library\wix\nupkgs\WixToolset.Util.wixext.{{ version }}.nupkg" exit 1
    # End-to-end CLI smoke: shim resolution, dotnet 6 runtime via rollForward
    # to the installed dotnet-runtime, wix.exe self-init, version output.
    - wix --help

about:
  home: https://wixtoolset.org/
  license: MS-RL
  license_family: Other
  license_file: LICENSE.TXT
  summary: WiX Toolset — create Windows Installer (MSI) packages
  description: |
    The WiX Toolset is a set of tools for building Windows Installer
    (MSI) packages from XML source. This package provides the v5.x
    `wix.exe` command-line driver, the WiX SDK assemblies (BuildTasks
    and burn), and the standard set of WiX extensions
    (Util, Bal, NetFx, ComPlus, Dependency, DirectX, Firewall, Http, Iis,
    Msmq, PowerShell, Sql, UI, VisualStudio).

    Built from source — does not ship the upstream `wix-cli-x64.msi` binary.
  dev_url: https://github.com/wixtoolset/wix
  doc_url: https://docs.firegiant.com/wixtoolset/

extra:
  recipe-maintainers:
    - xkong-anaconda
